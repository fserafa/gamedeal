<header>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-nav py-3">
    <div class="container">
      <a class="navbar-brand" href="#home">gamedeal.ga</a>
      <button 
        class="navbar-toggler border-0" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#navbarContent" 
        aria-controls="navbarContent" 
        aria-expanded="false" 
        aria-label="Toggle navigation"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2">
          <li class="nav-item">
            <a class="nav-link" href="#free" (click)="closeMenu()">Free Games</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#deals" (click)="closeMenu()">Deals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#about" (click)="closeMenu()">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container" style="margin-top: 100px; padding-bottom: 50px;">
  <ng-content></ng-content>
</main>
